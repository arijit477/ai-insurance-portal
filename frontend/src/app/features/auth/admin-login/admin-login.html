<div class="admin-login-container">
  <div class="glow-bg">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <mat-card class="admin-card glass-panel">
    <mat-card-header class="admin-header">
      <div class="portal-badge">
        <mat-icon>admin_panel_settings</mat-icon>
        <span>SECURE GATEWAY</span>
      </div>
      <mat-card-title>AuraGuard AI</mat-card-title>
      <mat-card-subtitle>Administrative Management Portal</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="login()" class="admin-form">
        <mat-form-field appearance="outline" class="custom-field">
          <mat-label>Admin Email</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="custom-field">
          <mat-label>Security Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error) {
          <div class="error-container">
            <mat-icon>error_outline</mat-icon>
            <span class="error-msg">{{ error }}</span>
          </div>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-btn"
          [disabled]="loading || loginForm.invalid"
        >
          @if (loading) {
            <mat-spinner diameter="24" class="login-spinner"></mat-spinner>
          } @else {
            <ng-container>
              <mat-icon class="btn-icon">verified_user</mat-icon>
              <span>Authorize & Enter</span>
            </ng-container>
          }
        </button>
      </form>

      <div class="back-link">
        <a routerLink="/login">
          <mat-icon>arrow_back</mat-icon>
          <span>Return to Customer Portal</span>
        </a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
