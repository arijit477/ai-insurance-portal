<div class="login-container">

  <mat-card>

    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
      <mat-card-subtitle>Welcome back to AuraGuard AI</mat-card-subtitle>
    </mat-card-header>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()">

      <mat-form-field appearance="outline">

        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          formControlName="email">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Password</mat-label>

        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password">

        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hidePassword">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit">

        Login

      </button>

    </form>

    @if(error){

      <p class="error-msg">{{error}}</p>

    }

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>

    <div class="admin-portal-link" style="margin-top: 15px; text-align: center;">
      <a routerLink="/admin-login" style="display: inline-flex; align-items: center; gap: 4px; color: #6366f1; text-decoration: none; font-size: 0.9rem; font-weight: 500;">
        <mat-icon style="font-size: 18px; width: 18px; height: 18px;">admin_panel_settings</mat-icon>
        <span>Access Administrator Portal</span>
      </a>
    </div>

  </mat-card>

</div>
