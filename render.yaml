services:
  - type: web
    name: ai-insurance-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///insurance.db # default fallback, user can change to PostgreSQL later
      - key: OPENAI_API_KEY
        sync: false # User must specify their OpenAI key on Render
